[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-cloud"
version = "26.10.0"
description = "Guardian Cloud v2 backend (SBC Guardian)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.20",
    "ortools==9.15.6755",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.15.12",
    "httpx==0.28.1",
    "rapidfuzz==3.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
