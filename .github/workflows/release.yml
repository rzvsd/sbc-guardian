name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:version -- --tag "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run test:ci
      - run: git diff --exit-code -- src/userscript.js
      - name: Restore private EA bundle artifact
        env:
          EA_BUNDLES_ARCHIVE_URL: ${{ secrets.EA_BUNDLES_ARCHIVE_URL }}
        run: |
          test -n "$EA_BUNDLES_ARCHIVE_URL"
          mkdir -p "$RUNNER_TEMP/ea-bundles"
          curl --fail --silent --show-error --location \
            "$EA_BUNDLES_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/ea-bundles.zip"
          unzip -q "$RUNNER_TEMP/ea-bundles.zip" -d "$RUNNER_TEMP/ea-bundles"
          BUNDLE_FILE="$(find "$RUNNER_TEMP/ea-bundles" -type f \
            \( -name 'compiled_*.js' -o -name 'ocompiled.js' \) \
            -print -quit)"
          test -n "$BUNDLE_FILE"
          echo "EA_BUNDLES_DIR=$(dirname "$BUNDLE_FILE")" >> "$GITHUB_ENV"
      - name: EA compatibility (release fail-closed)
        run: npm run check:ea-release -- --require
      - run: npm run package
      - run: npm run package:smoke
      - uses: softprops/action-gh-release@v3
        with:
          files: extension/dist/fsu-fut-enhancer-*.zip
          generate_release_notes: true
          body: |
            ## 安裝

            1. 下載下方 **Assets** 中的 `fsu-fut-enhancer-*.zip` 並解壓
            2. Chrome 打開 `chrome://extensions`，開啟「開發人員模式」
            3. 「載入未封裝項目」→ 選解壓後的資料夾（內含 `manifest.json`）
            4. 打開 FUT Web App，若曾重載過擴充功能請 **F5** 刷新分頁

            > 非 Chrome Web Store 發行，首次安裝需手動載入未封裝項目。
