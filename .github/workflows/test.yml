name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:version
      - run: npm run lint
      - run: npm run test:ci
      - run: git diff --exit-code -- src/userscript.js
      - run: npm run package
      - run: npm run package:smoke
      # Sanitized / unit EA inventory coverage lives in npm test (ea-bundle-check.test.mjs).
      # Full local EA bundles are optional on PR; release fails closed via verify:release.
